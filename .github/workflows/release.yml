name: Release

on:
  push:
    tags:
      - "v*.*.*"
  pull_request:
    branches:
      - master
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to rebuild, for example v0.1.0"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    name: Validate build metadata
    runs-on: ubuntu-26.04
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      is-release: ${{ steps.version.outputs.is-release }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Validate versions and release tag
        id: version
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail

          IS_RELEASE=false
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            TAG="$DISPATCH_TAG"
            IS_RELEASE=true
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF_NAME}"
            IS_RELEASE=true
          else
            TAG=""
          fi

          if [[ "$IS_RELEASE" == "true" && ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag must match vMAJOR.MINOR.PATCH, got: $TAG" >&2
            exit 1
          fi

          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          TAURI_VERSION="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          CARGO_VERSION="$(python3 - <<'PY'
          import pathlib
          import re
          manifest = pathlib.Path("src-tauri/Cargo.toml").read_text(encoding="utf-8")
          match = re.search(r'^version\s*=\s*"([^"]+)"', manifest, re.MULTILINE)
          print(match.group(1) if match else "")
          PY
          )"
          VERSION="$PACKAGE_VERSION"
          if [[ "$IS_RELEASE" == "true" ]]; then
            VERSION="${TAG#v}"
          fi

          if [[ "$PACKAGE_VERSION" != "$VERSION" || "$TAURI_VERSION" != "$VERSION" || "$CARGO_VERSION" != "$VERSION" ]]; then
            echo "Version mismatch for ${TAG:-branch build}" >&2
            echo "package.json=$PACKAGE_VERSION" >&2
            echo "src-tauri/tauri.conf.json=$TAURI_VERSION" >&2
            echo "src-tauri/Cargo.toml=$CARGO_VERSION" >&2
            exit 1
          fi
          {
            echo "tag=$TAG"
            echo "version=$VERSION"
            echo "is-release=$IS_RELEASE"
          } >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.name }}
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-2025-vs2026
            target: x86_64-pc-windows-msvc
            bundles: nsis
            install-linux-deps: false
            runtime-platform: windows-x64
          - name: windows-arm64
            os: windows-11-vs2026-arm
            target: aarch64-pc-windows-msvc
            bundles: nsis
            install-linux-deps: false
            runtime-platform: windows-arm64
          - name: macos-x64
            os: macos-26-intel
            target: x86_64-apple-darwin
            bundles: dmg
            install-linux-deps: false
            runtime-platform: macos-x64
          - name: macos-arm64
            os: macos-26
            target: aarch64-apple-darwin
            bundles: dmg
            install-linux-deps: false
            runtime-platform: macos-arm64
          - name: ubuntu-x64
            os: ubuntu-26.04
            target: x86_64-unknown-linux-gnu
            bundles: appimage deb
            install-linux-deps: true
            runtime-platform: ubuntu-x64
          - name: ubuntu-arm64
            os: ubuntu-26.04-arm
            target: aarch64-unknown-linux-gnu
            bundles: appimage deb
            install-linux-deps: true
            runtime-platform: ubuntu-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux dependencies
        if: matrix.install-linux-deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            desktop-file-utils \
            xdg-utils \
            file \
            patchelf

      - name: Install dependencies
        run: npm ci

      - name: Verify app icons
        run: npm run verify:icons

      - name: Typecheck and build frontend
        run: npm run build

      - name: Run Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --target ${{ matrix.target }}

      - name: Test embedding fast path sidecar
        if: matrix.name == 'windows-x64' || matrix.name == 'ubuntu-x64'
        shell: pwsh
        run: cargo test --release --locked --manifest-path src-fastpath/Cargo.toml

      - name: Build embedding fast path sidecar
        if: matrix.name == 'windows-x64' || matrix.name == 'ubuntu-x64'
        shell: pwsh
        run: ./scripts/build-fastpath.ps1

      - name: Prepare bundled llama.cpp runtime
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: ./scripts/prepare-bundled-runtime.ps1 -RuntimePlatform ${{ matrix.runtime-platform }}

      - name: Build Tauri bundles
        if: runner.os != 'macOS'
        run: npx tauri build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} --ci --no-sign

      - name: Build Tauri DMG
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -uo pipefail

          for attempt in 1 2; do
            if npx tauri build --target "${{ matrix.target }}" --bundles "${{ matrix.bundles }}" --ci --no-sign; then
              exit 0
            fi

            if [[ "$attempt" -eq 2 ]]; then
              exit 1
            fi

            echo "::warning::macOS DMG bundling failed; cleaning transient state before one retry"
            if [[ -d /Volumes/Vekai ]]; then
              hdiutil detach /Volumes/Vekai || hdiutil detach -force /Volumes/Vekai || true
            fi
            rm -rf "src-tauri/target/${{ matrix.target }}/release/bundle/dmg"
            sleep 5
          done

      - name: Collect release artifacts
        shell: pwsh
        run: ./scripts/collect-release-artifacts.ps1 -OutputDir release-artifacts -TargetName ${{ matrix.name }} -RuntimePlatform ${{ matrix.runtime-platform }}

      - name: Upload release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: vekai-${{ needs.validate.outputs.version }}-${{ matrix.name }}
          path: release-artifacts/*
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    if: needs.validate.outputs.is-release == 'true'
    needs:
      - validate
      - build
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.validate.outputs.tag }}

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-artifacts
          merge-multiple: true

      - name: List release artifacts
        run: find release-artifacts -type f -maxdepth 1 -print | sort

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.validate.outputs.tag }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release-artifacts/* --clobber
          else
            gh release create "$TAG" release-artifacts/* \
              --title "Vekai $VERSION" \
              --notes "Automated release for Vekai $VERSION."
          fi
